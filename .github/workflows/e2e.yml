name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  e2e:
    name: e2e (${{ matrix.environment }})
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest-large
    container:
      image: twilio/twilio-video-browsers:chrome-stable
    env:
      BROWSER: chrome
      DISPLAY: ':99'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [stage]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Artifactory OIDC Auth
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/artifactory-oidc

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GHA container jobs skip the image's own ENTRYPOINT (which normally starts
      # these), so they're started explicitly here instead.
      - name: Start Xvfb and dbus
        run: |
          sudo dbus-daemon --system --fork
          Xvfb $DISPLAY -screen 0 1280x1024x24 &
          sleep 1

      - name: Mint GitHub OIDC token for the e2e credential vendor
        id: mint-vendor-token
        env:
          VENDOR_AUDIENCE: ${{ matrix.environment == 'stage' && vars.VENDOR_URL_STAGE || vars.VENDOR_URL_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::id-token permission not granted; cannot mint an OIDC token."
            exit 1
          fi
          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${VENDOR_AUDIENCE}" \
            | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to mint OIDC token for the e2e vendor."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run e2e integration tests
        env:
          VENDOR_URL: ${{ matrix.environment == 'stage' && vars.VENDOR_URL_STAGE || vars.VENDOR_URL_PROD }}
          VENDOR_TOKEN: ${{ steps.mint-vendor-token.outputs.token }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: npm run test:integration
